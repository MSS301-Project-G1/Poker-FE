# docker compose up --build                     -> production build on http://localhost:3000
# docker compose --profile dev up --build dev   -> Vite dev server (game mode) on http://localhost:5173
# The backend runs outside this file (Poker-BE compose or Java on the host) and is reached
# through host.docker.internal. Point the *_URL variables elsewhere if it runs on another host.
services:
  web:
    build:
      context: .
      target: prod
      args:
        VITE_GAME_API_BASE_URL: ${VITE_GAME_API_BASE_URL:-}
        VITE_GAME_WS_URL: ${VITE_GAME_WS_URL:-}
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://host.docker.internal:8080}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    init: true
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://host.docker.internal:8082}
      # Bind mounts from Windows/macOS do not deliver file events to Linux, so HMR polls.
      WATCH_POLLING: "true"
    volumes:
      - .:/app
      # Keep the container's Linux node_modules; the host's Windows binaries would not run.
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
