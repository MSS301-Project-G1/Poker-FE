name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: poker-fe-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mss301-project-g1/poker-fe
  PUBLIC_URL: https://game-fun.me

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    name: Build image & deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The VPS is ARM (Oracle Ampere); building on an ARM runner avoids emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: poker/fe
      TAG: ${{ github.sha }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing repository secrets VPS_HOST / VPS_USER / VPS_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build --target prod \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:$TAG" .
          docker push --quiet "$IMAGE:$TAG"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15" >> "$GITHUB_ENV"

      - name: Sync compose files
        run: |
          $SSH_CMD "$VPS_USER@$VPS_HOST" "mkdir -p $APP_DIR"
          rsync -az --delete -e "$SSH_CMD" compose.yml Dockerfile deploy "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | $SSH_CMD "$VPS_USER@$VPS_HOST" \
            "GHCR_USER=${{ github.actor }} bash $APP_DIR/deploy/remote-deploy.sh $TAG"

      - name: Check from the Internet
        run: curl -fsS --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$PUBLIC_URL/"
