# Production overrides on top of compose.yml (used by deploy/remote-deploy.sh):
#   docker compose -p poker-fe -f compose.yml -f deploy/compose.prod.yml up -d web
# - Runs the image CI pushed to GHCR (IMAGE_TAG in .env) instead of building on the VPS.
# - Published on 127.0.0.1 only: Caddy on the host terminates HTTPS for the domain and proxies here.
#   Docker-published ports bypass the host firewall, so 0.0.0.0 would expose plain HTTP.
# - Joins the Poker-BE compose network and proxies to the services by name.
services:
  web:
    image: ghcr.io/mss301-project-g1/poker-fe:${IMAGE_TAG:?IMAGE_TAG is not set}
    ports: !override
      - "127.0.0.1:3000:80"
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      GAME_SERVICE_URL: http://game-service:8082
      SOCIAL_SERVICE_URL: http://social-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085

networks:
  default:
    name: poker_default
    external: true
